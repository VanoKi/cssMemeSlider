<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cssMemeSlider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="all">
    <input type="radio" name="respond" id="desktop" checked>
    <article id="slider">
      <input type="radio" name="slider" id="swithc1" checked>
      <input type="radio" name="slider" id="swithc2">
      <input type="radio" name="slider" id="swithc3">
      <input type="radio" name="slider" id="swithc4">

      <div id="slides">
        <div id="overflow">
          <div class="image">
              <article><img src="img/1.jpeg" alt="1"></article>
              <article><img src="img/2.jpg" alt="2"></article>
              <article><img src="img/3.jpg" alt="3"></article>
              <article><img src="img/4.jpg" alt="4"></article>
          </div>
        </div>
      </div>
      <div id="control">
        <label for="switch1"></label>
        <label for="switch2"></label>
        <label for="switch3"></label>
        <label for="switch4"></label>
      </div>

      <div id="active">
        <label for="switch1"></label>
        <label for="switch2"></label>
        <label for="switch3"></label>
        <label for="switch4"></label>
      </div>

    </article>
  </div>
</body>
</html>
